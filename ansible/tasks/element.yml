---
# Official installation: https://element.io/en/download
- name: Require a supported Element host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.architecture in ["x86_64", "aarch64"]

- name: Install Element repository signing key
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/apt/element-io-archive-keyring.gpg"
    dest: /usr/share/keyrings/element-io-archive-keyring.gpg
    mode: "0644"

- name: Configure Element stable repository
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/apt/element.sources"
    dest: /etc/apt/sources.list.d/element.sources
    mode: "0644"

- name: Install or upgrade Element Desktop
  become: true
  ansible.builtin.apt:
    name: element-desktop
    state: latest  # noqa package-latest
    update_cache: true
  when: not ansible_check_mode
