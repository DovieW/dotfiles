---
- name: Inspect installed Connection Check dependencies
  ansible.builtin.package_facts:
    manager: apt

- name: Install Connection Check dependencies
  become: true
  ansible.builtin.apt:
    name: [python3-pyqt6, network-manager, iw, iproute2, iputils-ping, curl, qdbus-qt6, python3-dbus]
    state: present
  when: >-
    ['python3-pyqt6', 'network-manager', 'iw', 'iproute2', 'iputils-ping', 'curl', 'qdbus-qt6', 'python3-dbus']
    | difference(ansible_facts.packages.keys() | list) | length > 0

- name: Create Connection Check directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [.local/bin, .local/share/applications, .local/share/icons/hicolor/scalable/apps]

- name: Install Connection Check
  ansible.builtin.copy:
    src: "{{ dot_repo }}/scripts/connection-check"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/connection-check"
    mode: "0755"

- name: Install Connection Check icon
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/applications/connection-check.svg"
    dest: >-
      {{ ansible_facts['user_dir'] }}/.local/share/icons/hicolor/scalable/apps/io.github.doview.connection-check.svg
    mode: "0644"
  register: dot_connection_check_icon

- name: Install Connection Check launcher
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', dot_repo + '/config/applications/io.github.doview.connection-check.desktop')
         | replace('Exec=connection-check',
                   'Exec=' + ansible_facts['user_dir'] + '/.local/bin/connection-check')
         | replace('Icon=io.github.doview.connection-check',
                   'Icon=' + ansible_facts['user_dir'] +
                   '/.local/share/icons/hicolor/scalable/apps/io.github.doview.connection-check.svg') }}
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/applications/io.github.doview.connection-check.desktop"
    mode: "0644"
  register: dot_connection_check_launcher

- name: Refresh KDE application cache after launcher installation
  ansible.builtin.command:
    argv: [kbuildsycoca6, --noincremental]
  changed_when: true
  when:
    - dot_connection_check_launcher.changed
    - not ansible_check_mode
    - ansible_facts.env.DISPLAY is defined or ansible_facts.env.WAYLAND_DISPLAY is defined

- name: Refresh Plasma icon cache after launcher or icon changes
  ansible.builtin.command:
    argv:
      - dbus-send
      - --session
      - --type=signal
      - /KIconLoader
      - org.kde.KIconLoader.iconChanged
      - int32:0
  changed_when: true
  when:
    - dot_connection_check_launcher.changed or dot_connection_check_icon.changed
    - not ansible_check_mode
    - ansible_facts.env.DISPLAY is defined or ansible_facts.env.WAYLAND_DISPLAY is defined

- name: Install Instant Connect
  ansible.builtin.copy:
    src: "{{ dot_repo }}/scripts/instant-wifi-connect"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/instant-wifi-connect"
    mode: "0755"

- name: Install Instant Connect launcher
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', dot_repo + '/config/applications/io.github.doview.instant-wifi-connect.desktop')
         | replace('Exec=instant-wifi-connect',
                   'Exec=' + ansible_facts['user_dir'] + '/.local/bin/instant-wifi-connect') }}
      {% if ansible_facts.product_name == '83JM' %}X-KDE-Shortcuts=Go{% endif %}
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/applications/io.github.doview.instant-wifi-connect.desktop"
    mode: "0644"
  register: dot_instant_connect_launcher

- name: Refresh KDE application cache for Instant Connect
  ansible.builtin.command:
    argv: [kbuildsycoca6, --noincremental]
  changed_when: true
  when:
    - dot_instant_connect_launcher.changed
    - not ansible_check_mode
    - ansible_facts.env.DISPLAY is defined or ansible_facts.env.WAYLAND_DISPLAY is defined

- name: Replace the previous Instant Connect shortcut in the running Plasma session
  when:
    - ansible_facts.product_name == '83JM'
    - not ansible_check_mode
    - ansible_facts.env.DISPLAY is defined or ansible_facts.env.WAYLAND_DISPLAY is defined
  vars:
    dot_instant_connect_accel:
      [busctl, --user, call, org.kde.kglobalaccel, /kglobalaccel, org.kde.KGlobalAccel]
    dot_instant_connect_action:
      ['4', io.github.doview.instant-wifi-connect.desktop, _launch, 'Instant Connect', 'Instant Connect']
  block:
    - name: Read the current Instant Connect shortcut
      ansible.builtin.command:
        argv: "{{ dot_instant_connect_accel + ['shortcut', 'as'] + dot_instant_connect_action }}"
      register: dot_instant_connect_old_shortcut
      changed_when: false
      failed_when: false

    - name: Migrate the previous F24 binding to Go
      ansible.builtin.command:
        argv: >-
          {{ dot_instant_connect_accel + ['setShortcut', 'asaiu']
             + dot_instant_connect_action + ['1', '16777431', item] }}
      changed_when: true
      loop: ['4', '8']
      when: dot_instant_connect_old_shortcut.stdout | trim == 'ai 1 16777287'
