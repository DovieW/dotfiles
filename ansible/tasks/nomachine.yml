---
- name: Validate NoMachine host platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.architecture == "x86_64"
    fail_msg: >-
      This managed NoMachine package is supported only on the native amd64
      Ubuntu or Kubuntu workstation.

- name: Read the active Tailscale IPv4 address
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  register: dot_nomachine_tailscale_ip
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record whether the private NoMachine endpoint can be configured
  ansible.builtin.set_fact:
    dot_nomachine_tailscale_ready: >-
      {{
        dot_nomachine_tailscale_ip.rc == 0
        and dot_nomachine_tailscale_ip.stdout_lines | length == 1
        and (dot_nomachine_tailscale_ip.stdout | trim)
          is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      }}

- name: Explain deferred NoMachine enrollment
  ansible.builtin.debug:
    msg: >-
      NoMachine was not installed because this workstation does not yet have
      an active Tailscale IPv4 address. Finish with `sudo tailscale up`, then
      run `dot apply --profile kubuntu-laptop --tags nomachine`. Deferring the
      package prevents its default listener from starting before it can be
      bound safely to Tailscale.
  when: not dot_nomachine_tailscale_ready

- name: Create the managed package cache
  become: true
  ansible.builtin.file:
    path: /var/cache/dotfiles
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: dot_nomachine_tailscale_ready

- name: Download the official NoMachine free-edition package
  become: true
  ansible.builtin.get_url:
    url: >-
      https://download.nomachine.com/download/9.8/Linux/nomachine_9.8.2_1_amd64.deb
    dest: /var/cache/dotfiles/nomachine_9.8.2_1_amd64.deb
    # Provider-published MD5: 29f24af614a1cd3da4e69c407fe31b2a.
    checksum: sha256:6c26d79ccfd21aca8a2d72b01b291896e8909adcb173eeabc75d8fdc59b83b64
    owner: root
    group: root
    mode: "0644"
  when: dot_nomachine_tailscale_ready

- name: Install NoMachine
  become: true
  ansible.builtin.apt:
    deb: /var/cache/dotfiles/nomachine_9.8.2_1_amd64.deb
    state: present
  when: dot_nomachine_tailscale_ready

- name: Install the HiDPI NoMachine client compositor
  become: true
  ansible.builtin.apt:
    name: gamescope
    state: latest
  when: dot_nomachine_tailscale_ready

- name: Install the adaptive NoMachine client launcher
  ansible.builtin.copy:
    src: "{{ dot_repo }}/scripts/nomachine-client"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/nomachine-client"
    mode: "0755"
  when: dot_nomachine_tailscale_ready

- name: Install the NoMachine microphone guard
  ansible.builtin.copy:
    src: "{{ dot_repo }}/scripts/nomachine-microphone-guard"
    dest: "{{ ansible_facts.env.HOME }}/.local/libexec/nomachine-microphone-guard"
    mode: "0755"
  when: dot_nomachine_tailscale_ready

- name: Install NoMachine client desktop overrides
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/nomachine/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/applications/{{ item }}"
    mode: "0644"
  loop: [NoMachine-base.desktop, NoMachine-nxs.desktop]
  when: dot_nomachine_tailscale_ready

- name: Read NoMachine EGL capture state
  ansible.builtin.command:
    argv: [grep, -E, '^EnableEGLCapture[[:space:]]+0$', /usr/NX/etc/node.cfg]
  register: dot_nomachine_egl_capture
  changed_when: false
  failed_when: false
  when: dot_nomachine_tailscale_ready

- name: Enable NoMachine EGL capture for Plasma Wayland
  become: true
  ansible.builtin.command:
    argv: [/etc/NX/nxserver, --eglcapture, "yes"]
  when:
    - dot_nomachine_tailscale_ready
    - dot_nomachine_egl_capture.rc == 0

- name: Install the managed NoMachine display adapter
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/scripts/nomachine-display"
    dest: /usr/local/libexec/nomachine-display
    owner: root
    group: root
    mode: "0755"
  when: dot_nomachine_tailscale_ready

- name: Install NoMachine display-event entry points
  become: true
  ansible.builtin.file:
    src: /usr/local/libexec/nomachine-display
    dest: "/usr/local/libexec/nomachine-display-{{ item }}"
    state: link
    force: true
  loop: [connect, disconnect, resize]
  when: dot_nomachine_tailscale_ready

- name: Adapt Plasma display geometry to NoMachine sessions
  become: true
  ansible.builtin.lineinfile:
    path: /usr/NX/etc/node.cfg
    regexp: "(?i)^#?{{ item.key }}\\s+"
    line: '{{ item.key }} "{{ item.script }}"'
  loop:
    - key: UserScriptAfterSessionStart
      script: /usr/local/libexec/nomachine-display-connect
    - key: UserScriptAfterSessionReconnect
      script: /usr/local/libexec/nomachine-display-connect
    - key: UserScriptAfterSessionDisconnect
      script: /usr/local/libexec/nomachine-display-disconnect
    - key: UserScriptAfterSessionClose
      script: /usr/local/libexec/nomachine-display-disconnect
    - key: UserScriptAfterSessionFailure
      script: /usr/local/libexec/nomachine-display-disconnect
    - key: UserScriptAfterRemoteResize
      script: /usr/local/libexec/nomachine-display-resize
  when: dot_nomachine_tailscale_ready

- name: Protect the physical display during NoMachine access
  become: true
  ansible.builtin.lineinfile:
    path: /usr/NX/etc/node.cfg
    regexp: "(?i)^#?{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - key: EnableScreenBlanking
      value: "1"
    - key: EnableScreenBlankingEffect
      value: "0"
  notify: Restart NoMachine after private-network configuration
  when: dot_nomachine_tailscale_ready

- name: Lock the physical desktop after NoMachine disconnects
  become: true
  ansible.builtin.lineinfile:
    path: /usr/NX/etc/server.cfg
    regexp: "(?i)^#?EnableLockScreen\\s+"
    line: "EnableLockScreen 1"
  notify: Restart NoMachine after private-network configuration
  when: dot_nomachine_tailscale_ready

- name: Preserve normal LAN SSH before enabling the host firewall
  become: true
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: dot_nomachine_tailscale_ready

- name: Allow direct Tailscale peer connectivity
  become: true
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp
  when: dot_nomachine_tailscale_ready

- name: Allow NoMachine only through Tailscale
  become: true
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - port: "4000"
      proto: tcp
    - port: "4000"
      proto: udp
    - port: "4011:4999"
      proto: udp
  when: dot_nomachine_tailscale_ready

- name: Deny unsolicited inbound traffic by default
  become: true
  community.general.ufw:
    direction: incoming
    default: deny
  when: dot_nomachine_tailscale_ready

- name: Allow outbound traffic by default
  become: true
  community.general.ufw:
    direction: outgoing
    default: allow
  when: dot_nomachine_tailscale_ready

- name: Enable the managed host firewall
  become: true
  community.general.ufw:
    state: enabled
  when: dot_nomachine_tailscale_ready

- name: Restrict NoMachine to private direct Tailscale connections
  become: true
  ansible.builtin.lineinfile:
    path: /usr/NX/etc/server.cfg
    regexp: "(?i)^#?{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - key: NXDListenAddress
      value: '"{{ dot_nomachine_tailscale_ip.stdout | trim }}"'
    - key: NXUDPPort
      value: "4000"
    - key: UDPPort
      value: "4011-4999"
    - key: ConnectPolicy
      value: "autocreate=1,autoconnect=1,automigrate=1,desktop=0,dialog=0,xsessions=0,udp=1"
    - key: EnableLocalNetworkBroadcast
      value: "0"
    - key: EnableNetwork
      value: "0"
    - key: EnableUPnP
      value: none
  register: dot_nomachine_private_config
  notify: Restart NoMachine after private-network configuration
  when: dot_nomachine_tailscale_ready

- name: Apply pending NoMachine configuration before verification
  ansible.builtin.meta: flush_handlers
  when: dot_nomachine_tailscale_ready

- name: Read NoMachine server status
  become: true
  ansible.builtin.command:
    argv: [/etc/NX/nxserver, --status]
  register: dot_nomachine_status
  changed_when: false
  when: dot_nomachine_tailscale_ready

- name: Verify the NoMachine NX listener
  ansible.builtin.wait_for:
    host: "{{ dot_nomachine_tailscale_ip.stdout | trim }}"
    port: 4000
    state: started
    timeout: 15
  when: dot_nomachine_tailscale_ready

- name: Report the private NoMachine endpoint
  ansible.builtin.debug:
    msg: >-
      NoMachine is running at nx://{{ dot_nomachine_tailscale_ip.stdout | trim }}:4000.
      Connect with the NoMachine client and this workstation's Linux account.
      TCP and UDP are restricted to Tailscale by the managed host firewall.
      A physical Plasma desktop switches to 1920x1200 at 115% while a remote
      session is connected and restores its prior mode after disconnection.
      The physical monitor is blanked during access and Plasma locks after the
      final disconnect.
      HiDPI clients launch through Gamescope so the complete legacy interface,
      including icons and controls, scales with the local display.
      Client microphone capture is muted without disabling remote audio output.
  when: dot_nomachine_tailscale_ready
