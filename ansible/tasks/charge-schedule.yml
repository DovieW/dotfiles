---
- name: Create the device policy directory
  become: true
  ansible.builtin.file:
    path: /etc/dotfiles
    state: directory
    mode: '0755'

- name: Install the IdeaPad charge schedule
  become: true
  ansible.builtin.copy:
    content: "{{ dot_device_manifest.charge_schedule | to_nice_json }}\n"
    dest: /etc/dotfiles/charge-schedule.json
    owner: root
    group: root
    mode: '0644'
  register: dot_charge_policy

- name: Install the charge scheduler and its resume hook
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: 'scripts/dot-charge', dest: '/usr/local/bin/dot-charge', mode: '0755'}
    - {src: 'config/systemd/system/dot-charge.service', dest: '/etc/systemd/system/dot-charge.service', mode: '0644'}
    - {src: 'config/systemd/system-sleep/dot-charge', dest: '/usr/lib/systemd/system-sleep/dot-charge', mode: '0755'}
  register: dot_charge_files

- name: Install Qt and UPower bindings for the battery controls
  become: true
  ansible.builtin.apt:
    name: [python3-pyqt6, python3-dbus, python3-gi, python3-pyudev]
    state: present

- name: Install the Battery Charging app and launcher
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: 'scripts/dot-charge-ui', dest: '/usr/local/bin/dot-charge-ui', mode: '0755'}
    - src: config/applications/io.github.doview.battery-charging.desktop
      dest: /usr/share/applications/io.github.doview.battery-charging.desktop
      mode: '0644'
  register: dot_charge_launcher

- name: Refresh the KDE launcher cache for Battery Charging
  ansible.builtin.command:
    argv: [kbuildsycoca6, --noincremental]
  changed_when: false
  when: dot_charge_launcher.changed and not ansible_check_mode

- name: Allow the local owner to set or clear a temporary charge override
  become: true
  ansible.builtin.copy:
    content: |
      {{ ansible_facts.user_id }} ALL=(root) NOPASSWD: /usr/local/bin/dot-charge auto
      {{ ansible_facts.user_id }} ALL=(root) NOPASSWD: /usr/local/bin/dot-charge hold *
      {{ ansible_facts.user_id }} ALL=(root) NOPASSWD: /usr/local/bin/dot-charge set-window *
    dest: /etc/sudoers.d/93-dot-charge
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Enable scheduled charging
  become: true
  ansible.builtin.systemd_service:
    name: dot-charge.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if dot_charge_policy.changed or dot_charge_files.changed else 'started' }}"
  when: not ansible_check_mode

- name: Prepare the private battery telemetry directory
  become: true
  ansible.builtin.file:
    path: /var/lib/dot-charge/telemetry
    state: directory
    owner: root
    group: "{{ ansible_facts.user_gid }}"
    mode: '2750'

- name: Create the battery telemetry code directory
  become: true
  ansible.builtin.file:
    path: /usr/local/libexec/dotfiles/charge-telemetry
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install battery telemetry and its systemd units
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: config/power/charge-telemetry/battery_store.py
      dest: /usr/local/libexec/dotfiles/charge-telemetry/battery_store.py
      mode: '0644'
    - src: config/power/charge-telemetry/battery_collect.py
      dest: /usr/local/libexec/dotfiles/charge-telemetry/battery_collect.py
      mode: '0644'
    - src: config/power/charge-telemetry/battery_analysis.py
      dest: /usr/local/libexec/dotfiles/charge-telemetry/battery_analysis.py
      mode: '0644'
    - src: config/power/charge-telemetry/battery_report.py
      dest: /usr/local/libexec/dotfiles/charge-telemetry/battery_report.py
      mode: '0644'
    - src: config/power/charge-telemetry/dot-charge-telemetry
      dest: /usr/local/libexec/dotfiles/charge-telemetry/dot-charge-telemetry
      mode: '0755'
    - src: config/systemd/system/dot-charge-telemetry.service
      dest: /etc/systemd/system/dot-charge-telemetry.service
      mode: '0644'
    - src: config/systemd/system/dot-charge-telemetry-backup.service
      dest: /etc/systemd/system/dot-charge-telemetry-backup.service
      mode: '0644'
    - src: config/systemd/system/dot-charge-telemetry-backup.timer
      dest: /etc/systemd/system/dot-charge-telemetry-backup.timer
      mode: '0644'
    - src: config/systemd/system-sleep/dot-charge-telemetry
      dest: /usr/lib/systemd/system-sleep/dot-charge-telemetry
      mode: '0755'
  register: dot_charge_telemetry_files

- name: Enable the battery telemetry collector
  become: true
  ansible.builtin.systemd_service:
    name: dot-charge-telemetry.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if dot_charge_telemetry_files.changed else 'started' }}"
  when: not ansible_check_mode

- name: Import any retained local UPower battery history
  become: true
  ansible.builtin.command:
    argv: [/usr/local/libexec/dotfiles/charge-telemetry/dot-charge-telemetry, import-history]
    creates: /var/lib/dot-charge/telemetry/history-imported
  when: not ansible_check_mode

- name: Enable the daily battery telemetry backup
  become: true
  ansible.builtin.systemd_service:
    name: dot-charge-telemetry-backup.timer
    enabled: true
    state: started
  when: not ansible_check_mode
