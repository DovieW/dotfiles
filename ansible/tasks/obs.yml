# Seed a normal editable profile. Never overwrite later GUI adjustments.
- name: Create OBS recording directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_facts.env.HOME }}/.config/obs-studio/basic/profiles/Dotfiles_1080p60"
    - "{{ ansible_facts.env.HOME }}/Videos/OBS"

- name: Seed OBS video and audio settings
  ansible.builtin.template:
    src: "{{ dot_repo }}/config/obs/basic.ini.j2"
    dest: "{{ ansible_facts.env.HOME }}/.config/obs-studio/basic/profiles/Dotfiles_1080p60/basic.ini"
    mode: "0600"
    force: false

- name: Seed OBS constant quality encoder settings
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/obs/recordEncoder.json"
    dest: "{{ ansible_facts.env.HOME }}/.config/obs-studio/basic/profiles/Dotfiles_1080p60/recordEncoder.json"
    mode: "0600"
    force: false
