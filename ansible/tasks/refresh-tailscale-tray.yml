---
- name: Refresh an active Tailscale tray after package updates
  ansible.builtin.command:
    argv: [bash, "{{ dot_repo }}/scripts/refresh-tailscale-tray"]
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.user_uid }}/bus
  register: dot_tailscale_tray_refresh
  changed_when: "'Restarted stale Tailscale tray' in dot_tailscale_tray_refresh.stdout"
  when:
    - not ansible_check_mode
    - dot_profile_data.features.kde | default(false)
    - ansible_facts.service_mgr == "systemd"
