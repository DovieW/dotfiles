---
- name: Validate NVIDIA driver operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: The managed NVIDIA desktop driver is supported only on Ubuntu and Kubuntu.

- name: Install Ubuntu driver selection support
  become: true
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    state: latest  # noqa package-latest
    update_cache: true
    cache_valid_time: 3600

- name: Read Ubuntu's recommended hardware drivers
  ansible.builtin.command:
    argv: [ubuntu-drivers, devices]
  register: dot_ubuntu_drivers
  changed_when: false

- name: Resolve Ubuntu's recommended NVIDIA desktop package
  ansible.builtin.set_fact:
    dot_nvidia_recommended_package: >-
      {{ (dot_ubuntu_drivers.stdout_lines
          | select('search', '^driver\s+:\s+nvidia-driver-.*recommended\s*$')
          | first
          | default('')).split()[2] | default('') }}

- name: Require an Ubuntu-recommended NVIDIA driver
  ansible.builtin.assert:
    that:
      - dot_nvidia_recommended_package | length > 0
      - dot_nvidia_recommended_package is match('^nvidia-driver-[0-9]+(-open)?$')
    fail_msg: >-
      Ubuntu did not report one unambiguous recommended NVIDIA desktop driver.
      Review `ubuntu-drivers devices`; no graphics package was changed.

- name: Install or upgrade Ubuntu's recommended NVIDIA driver
  become: true
  ansible.builtin.apt:
    name: "{{ dot_nvidia_recommended_package }}"
    state: latest  # noqa package-latest
    update_cache: true
  when: not ansible_check_mode

- name: Read the current PRIME mode
  ansible.builtin.command:
    argv: [prime-select, query]
  register: dot_prime_mode
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Keep Intel as default and NVIDIA available on demand
  become: true
  ansible.builtin.command:
    argv: [prime-select, on-demand]
  changed_when: true
  when:
    - not ansible_check_mode
    - dot_prime_mode.stdout | default('') | trim != 'on-demand'

- name: Create the desktop user's autostart override directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/autostart"
    state: directory
    mode: "0755"
  when: not (dot_profile_data.features.nvidia_settings_autostart | default(true) | bool)

- name: Disable the unnecessary NVIDIA settings loader
  ansible.builtin.file:
    src: "{{ dot_repo }}/config/nvidia/nvidia-settings-autostart.desktop"
    dest: "{{ ansible_facts['user_dir'] }}/.config/autostart/nvidia-settings-autostart.desktop"
    state: link
    force: true
  register: dot_nvidia_settings_autostart_override
  when: not (dot_profile_data.features.nvidia_settings_autostart | default(true) | bool)

- name: Regenerate user services after disabling the NVIDIA settings loader
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.user_uid }}/bus
  when:
    - not ansible_check_mode
    - dot_nvidia_settings_autostart_override.changed | default(false)

- name: Clear the retired NVIDIA settings loader failure
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - reset-failed
      - 'app-nvidia\x2dsettings\x2dautostart@autostart.service'
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - dot_nvidia_settings_autostart_override.changed | default(false)

- name: Disable unstable NVIDIA Dynamic Boost on affected firmware
  become: true
  ansible.builtin.systemd_service:
    name: nvidia-powerd.service
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - not (dot_profile_data.features.nvidia_dynamic_boost | default(true) | bool)

- name: Read the disabled Dynamic Boost failure state
  become: true
  ansible.builtin.command:
    argv: [systemctl, is-failed, --quiet, nvidia-powerd.service]
  register: dot_nvidia_powerd_failed
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - not (dot_profile_data.features.nvidia_dynamic_boost | default(true) | bool)

- name: Clear the disabled Dynamic Boost failure state
  become: true
  ansible.builtin.command:
    argv: [systemctl, reset-failed, nvidia-powerd.service]
  changed_when: false
  when:
    - not ansible_check_mode
    - not (dot_profile_data.features.nvidia_dynamic_boost | default(true) | bool)
    - dot_nvidia_powerd_failed.rc == 0

- name: Report NVIDIA reboot requirement
  ansible.builtin.debug:
    msg: >-
      {{ dot_nvidia_recommended_package }} is installed with PRIME on-demand.
      Reboot before validating nvidia-smi, the loaded kernel module, and runtime
      power management. NVIDIA Dynamic Boost is
      {{
        'enabled'
        if dot_profile_data.features.nvidia_dynamic_boost | default(true)
        else 'disabled because it crashes with this laptop firmware'
      }}.
  when: not ansible_check_mode

- name: Explain NVIDIA check mode
  ansible.builtin.debug:
    msg: >-
      Ubuntu recommends {{ dot_nvidia_recommended_package }}. A real apply will
      install its latest repository candidate and select PRIME on-demand.
  when: ansible_check_mode
