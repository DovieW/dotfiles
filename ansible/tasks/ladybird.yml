---
# Official installation and signing-key fingerprint: https://ladybird.org/download/
- name: Require a supported Ladybird host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_release in ["noble", "resolute"]
      - ansible_facts.architecture in ["x86_64", "aarch64"]
    fail_msg: Ladybird's managed APT repository supports Ubuntu 24.04 and 26.04 on amd64 and arm64.

- name: Install the Ladybird repository signing key
  become: true
  ansible.builtin.copy:
    src: "{{ dot_repo }}/config/apt/ladybird-archive-keyring.asc"
    dest: /usr/share/keyrings/ladybird-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the official Ladybird APT repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ladybird.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://apt.ladybird.org/
      Suites: {{ ansible_facts.distribution_release }}
      Components: main
      Architectures: amd64 arm64
      Signed-By: /usr/share/keyrings/ladybird-archive-keyring.asc

- name: Install or upgrade Ladybird from its rolling alpha channel
  become: true
  ansible.builtin.apt:
    name: ladybird
    state: latest  # noqa package-latest
    update_cache: true
  register: dot_ladybird_package
  when: not ansible_check_mode

- name: Explain how to activate an update in a running Ladybird session
  ansible.builtin.debug:
    msg: If Ladybird is open, save your work and fully quit and reopen it to load the installed version.
  when: dot_ladybird_package is changed  # noqa no-handler
