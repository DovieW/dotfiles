---
- name: Apply the selected dotfiles profile
  hosts: local
  gather_facts: true
  vars:
    dot_repo: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Validate runtime profile
      ansible.builtin.assert:
        that:
          - dot_profile_data.schema_version == 1
          - dot_profile_data.name == dot_profile
          - dot_profile_data.packages is mapping
        fail_msg: >-
          Run this playbook through bin/dot so inherited profile data is
          supplied.
      tags: [always]

  tasks:
    - name: Configure native Docker Engine
      ansible.builtin.include_tasks:
        file: tasks/docker.yml
        apply:
          tags: [packages, docker]
      when: dot_profile_data.features.docker_engine | default(false)
      tags: [packages, docker]

    # Workstation policy intentionally follows current stable repository candidates.
    - name: Install or upgrade APT packages to latest repository candidates  # noqa package-latest
      become: true
      ansible.builtin.apt:
        name: "{{ dot_profile_data.packages.apt | default([]) }}"
        state: latest
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_facts.os_family == "Debian"
        - (dot_profile_data.packages.apt | default([]) | length) > 0
      tags: [packages]

    - name: Resolve latest stable external Debian packages
      ansible.builtin.command:
        argv: ["{{ dot_repo }}/scripts/fetch-external-deb", "{{ item }}"]
      register: dot_external_deb_downloads
      changed_when: false
      check_mode: false
      loop: "{{ dot_profile_data.packages.deb | default([]) }}"
      when:
        - ansible_facts.os_family == "Debian"
        - (dot_profile_data.packages.deb | default([]) | length) > 0
      tags: [packages]

    - name: Install latest stable external Debian packages
      become: true
      ansible.builtin.apt:
        deb: "{{ item.stdout }}"
        state: present
      loop: "{{ dot_external_deb_downloads.results | default([]) }}"
      when: not item.skipped | default(false)
      tags: [packages]

    - name: Check Homebrew availability
      ansible.builtin.command: brew --version
      register: dot_brew
      changed_when: false
      failed_when: false
      when: (dot_profile_data.packages.brew | default([]) | length) > 0
      tags: [packages]

    - name: Require Homebrew for shared CLI packages
      ansible.builtin.assert:
        that: dot_brew.rc == 0
        fail_msg: >-
          Homebrew is required for shared CLI tools. Install it from
          https://brew.sh, then rerun dot apply.
      when: (dot_profile_data.packages.brew | default([]) | length) > 0
      tags: [packages]

    - name: Read installed Homebrew formulae
      ansible.builtin.command: brew list --formula
      register: dot_brew_formulae
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages]

    - name: Update Homebrew metadata
      ansible.builtin.command: brew update
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages]

    - name: Install missing Homebrew formulae
      ansible.builtin.command:
        argv: [brew, install, "{{ item }}"]
      changed_when: true
      loop: "{{ dot_profile_data.packages.brew | default([]) }}"
      when:
        - dot_brew.rc | default(1) == 0
        - item not in dot_brew_formulae.stdout_lines
      tags: [packages]

    - name: Read outdated Homebrew formulae
      ansible.builtin.command: brew outdated --formula
      register: dot_brew_outdated
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages]

    - name: Upgrade managed Homebrew formulae
      ansible.builtin.command:
        argv: [brew, upgrade, "{{ item }}"]
      changed_when: true
      loop: "{{ dot_profile_data.packages.brew | default([]) }}"
      when:
        - dot_brew.rc | default(1) == 0
        - item in dot_brew_outdated.stdout_lines
      tags: [packages]

    - name: Check curated Snap applications
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'command -v "$1" >/dev/null 2>&1 || snap list "$1" >/dev/null 2>&1'
          - sh
          - "{{ item }}"
      register: dot_snap_status
      changed_when: false
      failed_when: false
      loop: "{{ dot_profile_data.packages.snap | default([]) }}"
      when: (dot_profile_data.packages.snap | default([]) | length) > 0
      tags: [packages]

    - name: Install curated Snap applications
      become: true
      ansible.builtin.command:
        argv: [snap, install, "{{ item.item }}"]
      changed_when: true
      loop: "{{ dot_snap_status.results | default([]) }}"
      when: item.rc != 0
      tags: [packages]

    - name: Refresh installed curated Snap applications
      become: true
      ansible.builtin.command:
        argv: [snap, refresh, "{{ item.item }}"]
      register: dot_snap_refresh
      changed_when: "'has no updates available' not in dot_snap_refresh.stdout"
      loop: "{{ dot_snap_status.results | default([]) }}"
      when: item.rc == 0
      tags: [packages]

    - name: Ensure Codex standalone CLI from stable channel
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/install-codex"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_codex_install
      changed_when: "'installed and verified' in dot_codex_install.stdout"
      check_mode: false
      when: dot_profile_data.features.codex_remote_control | default(false)
      tags: [packages, config]

    - name: Ensure Vite+ CLI from stable channel
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/install-vite-plus"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_vite_plus_install
      changed_when: >-
        'installed and verified' in dot_vite_plus_install.stdout or
        'shell integration generated' in dot_vite_plus_install.stdout
      check_mode: false
      when: dot_profile_data.features.vite_plus | default(false)
      tags: [packages, config, shell]

    - name: Apply portable configuration
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/bin/dot"
          - apply
          - --profile
          - "{{ dot_profile }}"
          - --direct
      register: dot_direct_apply
      changed_when: >-
        'Applied ' in dot_direct_apply.stdout and
        '0 configuration change(s)' not in dot_direct_apply.stdout
      tags: [config, shell, git, kde]

    - name: Provision Segoe UI Variable from Windows
      ansible.builtin.command:
        argv: ["{{ dot_repo }}/scripts/provision-segoe"]
      register: dot_segoe
      changed_when: >-
        dot_segoe.rc == 0 and
        dot_segoe.stdout is match('^Segoe UI Variable installed ')
      failed_when: false
      when: dot_profile_data.features.windows_fonts | default(false)
      tags: [fonts, kde]

    - name: Report unavailable Segoe source
      ansible.builtin.debug:
        msg: >-
          {{ dot_segoe.stdout |
             default('Segoe provisioning did not run') }}
      when:
        - dot_profile_data.features.windows_fonts | default(false)
        - dot_segoe.rc | default(0) != 0
      tags: [fonts, kde]

    - name: Make Zsh the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      when:
        - dot_profile_data.features.shell | default(false)
        - ansible_facts.system != "Windows"
        - ansible_facts.user_shell != "/usr/bin/zsh"
      tags: [shell]
