---
- name: Apply the selected dotfiles profile
  hosts: local
  gather_facts: true
  vars:
    dot_repo: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Validate runtime profile
      ansible.builtin.assert:
        that:
          - dot_profile_data.schema_version == 1
          - dot_profile_data.name == dot_profile
          - dot_profile_data.packages is mapping
        fail_msg: >-
          Run this playbook through bin/dot so inherited profile data is
          supplied.
      tags: [always]

  tasks:
    - name: Upgrade all installed APT packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      when: ansible_facts.os_family == "Debian"
      tags: [system-updates]

    - name: Check whether Snap is installed
      ansible.builtin.stat:
        path: /usr/bin/snap
      register: dot_snap_binary
      tags: [app-updates]

    - name: Refresh every installed Snap
      become: true
      ansible.builtin.command:
        argv: [snap, refresh]
      environment:
        LC_ALL: C
      register: dot_snap_refresh_all
      changed_when: "'All snaps up to date.' not in dot_snap_refresh_all.stdout"
      when: dot_snap_binary.stat.executable | default(false)
      tags: [app-updates]

    - name: Configure native Docker Engine
      ansible.builtin.include_tasks:
        file: tasks/docker.yml
        apply:
          tags: [packages, docker]
      when: dot_profile_data.features.docker_engine | default(false)
      tags: [packages, docker]

    - name: Configure Tailscale
      ansible.builtin.include_tasks:
        file: tasks/tailscale.yml
        apply:
          tags: [packages, tailscale, app-updates]
      when: dot_profile_data.features.tailscale | default(false)
      tags: [packages, tailscale, app-updates]

    - name: Configure Ubuntu's recommended NVIDIA driver
      ansible.builtin.include_tasks:
        file: tasks/nvidia.yml
        apply:
          tags: [packages, gpu]
      when: dot_profile_data.features.nvidia_driver | default(false)
      tags: [packages, gpu]

    - name: Configure Visual Studio Code
      ansible.builtin.include_tasks:
        file: tasks/vscode.yml
        apply:
          tags: [packages, vscode, app-updates]
      when: dot_profile_data.features.vscode | default(false)
      tags: [packages, vscode, app-updates]

    - name: Configure Remote Desktop file support
      ansible.builtin.include_tasks:
        file: tasks/rdp.yml
        apply:
          tags: [packages, rdp, app-updates]
      when: dot_profile_data.features.rdp_files | default(false)
      tags: [packages, rdp, app-updates]

    - name: Configure CopyQ clipboard history
      ansible.builtin.include_tasks:
        file: tasks/copyq.yml
        apply:
          tags: [packages, clipboard, app-updates]
      when: dot_profile_data.features.copyq | default(false)
      tags: [packages, clipboard, app-updates]

    # Workstation policy intentionally follows current stable repository candidates.
    - name: Install or upgrade APT packages to latest repository candidates  # noqa package-latest
      become: true
      ansible.builtin.apt:
        name: "{{ dot_profile_data.packages.apt | default([]) }}"
        state: latest
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_facts.os_family == "Debian"
        - (dot_profile_data.packages.apt | default([]) | length) > 0
      tags: [packages]

    - name: Configure the direct-insertion Emoji picker
      ansible.builtin.include_tasks:
        file: tasks/emoji-picker.yml
        apply:
          tags: [packages, emoji, clipboard, app-updates]
      when: dot_profile_data.features.emoji_picker | default(false)
      tags: [packages, emoji, clipboard, app-updates]

    - name: Install or upgrade FiraCode Nerd Font Mono from the stable channel
      ansible.builtin.command:
        argv: ["{{ dot_repo }}/scripts/install-firacode-nerd-font", "--ensure"]
      register: dot_firacode_nerd_font
      changed_when: "' installed from ' in dot_firacode_nerd_font.stdout"
      when: dot_profile_data.features.firacode_nerd_font | default(false)
      tags: [packages, fonts, app-updates]

    - name: Configure customizable Plasma touchpad gestures
      ansible.builtin.include_tasks:
        file: tasks/inputactions.yml
        apply:
          tags: [packages, gestures, app-updates]
      when: dot_profile_data.features.inputactions | default(false)
      tags: [packages, gestures, app-updates]

    - name: Configure the CIRQ touchpad jump workaround
      ansible.builtin.include_tasks:
        file: tasks/touchpad.yml
        apply:
          tags: [packages, touchpad]
      when: dot_profile_data.features.touchpad_jump_workaround | default(false)
      tags: [packages, touchpad]

    - name: Resolve latest stable external Debian packages
      ansible.builtin.command:
        argv: ["{{ dot_repo }}/scripts/fetch-external-deb", "{{ item }}"]
      register: dot_external_deb_downloads
      changed_when: false
      check_mode: false
      loop: "{{ dot_profile_data.packages.deb | default([]) }}"
      when:
        - ansible_facts.os_family == "Debian"
        - (dot_profile_data.packages.deb | default([]) | length) > 0
      tags: [packages, app-updates]

    - name: Install latest stable external Debian packages
      become: true
      ansible.builtin.apt:
        deb: "{{ item.stdout }}"
        state: present
      loop: "{{ dot_external_deb_downloads.results | default([]) }}"
      when: not item.skipped | default(false)
      tags: [packages, app-updates]

    - name: Check Homebrew availability
      ansible.builtin.command: brew --version
      register: dot_brew
      changed_when: false
      failed_when: false
      when: (dot_profile_data.packages.brew | default([]) | length) > 0
      tags: [packages, app-updates]

    - name: Require Homebrew for shared CLI packages
      ansible.builtin.assert:
        that: dot_brew.rc == 0
        fail_msg: >-
          Homebrew is required for shared CLI tools. Install it from
          https://brew.sh, then rerun dot apply.
      when: (dot_profile_data.packages.brew | default([]) | length) > 0
      tags: [packages, app-updates]

    - name: Read installed Homebrew formulae
      ansible.builtin.command: brew list --formula
      register: dot_brew_formulae
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages]

    - name: Update Homebrew metadata
      ansible.builtin.command: brew update
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages, app-updates]

    - name: Install missing Homebrew formulae
      ansible.builtin.command:
        argv: [brew, install, "{{ item }}"]
      changed_when: true
      loop: "{{ dot_profile_data.packages.brew | default([]) }}"
      when:
        - dot_brew.rc | default(1) == 0
        - item not in dot_brew_formulae.stdout_lines
      tags: [packages]

    - name: Read outdated Homebrew formulae
      ansible.builtin.command: brew outdated --formula
      register: dot_brew_outdated
      changed_when: false
      when: dot_brew.rc | default(1) == 0
      tags: [packages, app-updates]

    - name: Upgrade managed Homebrew formulae
      ansible.builtin.command:
        argv: [brew, upgrade, "{{ item }}"]
      changed_when: true
      loop: "{{ dot_profile_data.packages.brew | default([]) }}"
      when:
        - dot_brew.rc | default(1) == 0
        - item in dot_brew_outdated.stdout_lines
      tags: [packages]

    - name: Upgrade all installed Homebrew formulae
      ansible.builtin.command:
        argv: [brew, upgrade]
      changed_when: true
      when:
        - dot_brew.rc | default(1) == 0
        - (dot_brew_outdated.stdout_lines | default([]) | length) > 0
      tags: [app-updates]

    - name: Check curated Snap applications
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'command -v "$1" >/dev/null 2>&1 || snap list "$1" >/dev/null 2>&1'
          - sh
          - "{{ item }}"
      register: dot_snap_status
      changed_when: false
      failed_when: false
      loop: "{{ dot_profile_data.packages.snap | default([]) }}"
      when: (dot_profile_data.packages.snap | default([]) | length) > 0
      tags: [packages]

    - name: Install curated Snap applications
      become: true
      ansible.builtin.command:
        argv: [snap, install, "{{ item.item }}"]
      changed_when: true
      loop: "{{ dot_snap_status.results | default([]) }}"
      when: item.rc != 0
      tags: [packages]

    - name: Refresh installed curated Snap applications
      become: true
      ansible.builtin.command:
        argv: [snap, refresh, "{{ item.item }}"]
      register: dot_snap_refresh
      changed_when: "'has no updates available' not in dot_snap_refresh.stdout"
      loop: "{{ dot_snap_status.results | default([]) }}"
      when: item.rc == 0
      tags: [packages]

    - name: Ensure Codex standalone CLI from stable channel
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/install-codex"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_codex_install
      changed_when: "'installed and verified' in dot_codex_install.stdout"
      check_mode: false
      when: dot_profile_data.features.codex_remote_control | default(false)
      tags: [packages, config]

    - name: Ensure Vite+ CLI from stable channel
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/install-vite-plus"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_vite_plus_install
      changed_when: >-
        'installed and verified' in dot_vite_plus_install.stdout or
        'shell integration generated' in dot_vite_plus_install.stdout
      check_mode: false
      when: dot_profile_data.features.vite_plus | default(false)
      tags: [packages, config, shell]

    - name: Ensure git-sync from the official stable branch
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/install-git-sync"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_git_sync_install
      changed_when: "'CHANGED ' in dot_git_sync_install.stdout"
      check_mode: false
      when: dot_profile_data.features.git | default(false)
      tags: [packages, config, git, app-updates]

    - name: Apply portable configuration
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/bin/dot"
          - apply
          - --profile
          - "{{ dot_profile }}"
          - --direct
          - --tags
          - "{{ ansible_run_tags | join(',') }}"
      register: dot_direct_apply
      changed_when: >-
        'Applied ' in dot_direct_apply.stdout and
        '0 configuration change(s)' not in dot_direct_apply.stdout
      tags: [config, shell, git, kde, lockscreen, power, tmux, nvim, display, vscode, rdp, clipboard, screenshots]

    - name: Configure native application window frames
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/scripts/configure-native-frames"
          - "{{ '--check' if ansible_check_mode else '--ensure' }}"
      register: dot_native_frames
      changed_when: >-
        'CHANGED ' in dot_native_frames.stdout or
        'DRIFT ' in dot_native_frames.stdout
      failed_when: >-
        dot_native_frames.rc != 0 and
        not (ansible_check_mode and dot_native_frames.rc == 1)
      when: dot_profile_data.features.kde | default(false)
      tags: [config, kde]

    - name: Reload user services after portable configuration
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user
      changed_when: false
      when:
        - dot_profile_data.features.kde | default(false)
        - not ansible_check_mode
      tags: [config, kde]

    - name: Restore Neovim's tested plugin graph
      ansible.builtin.command:
        argv:
          - nvim
          - --headless
          - "+Lazy! restore"
          - "+qa"
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"
      changed_when: false
      when:
        - dot_profile_data.features.neovim | default(false)
        - not ansible_check_mode
      tags: [config, nvim]

    - name: Install Neovim's curated language tools
      ansible.builtin.command:
        argv:
          - nvim
          - --headless
          - "+Lazy! load nvim-lspconfig"
          - "+MasonToolsInstallSync"
          - "+qa"
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"
      register: dot_nvim_mason
      changed_when: >-
        'installing' in dot_nvim_mason.stdout or
        'installing' in dot_nvim_mason.stderr
      when:
        - dot_profile_data.features.neovim | default(false)
        - not ansible_check_mode
      tags: [config, nvim]

    - name: Verify the managed Neovim runtime
      ansible.builtin.command:
        argv:
          - "{{ dot_repo }}/bin/dot"
          - nvim
          - status
          - --profile
          - "{{ dot_profile }}"
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"
      changed_when: false
      when:
        - dot_profile_data.features.neovim | default(false)
        - not ansible_check_mode
      tags: [config, nvim]

    - name: Create the InputActions configuration directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/inputactions"
        state: directory
        mode: "0700"
      when: dot_profile_data.features.inputactions | default(false)
      tags: [config, kde, gestures]

    - name: Apply the managed InputActions gesture configuration
      ansible.builtin.copy:
        src: "{{ dot_repo }}/config/inputactions/config.yaml"
        dest: "{{ ansible_facts.env.HOME }}/.config/inputactions/config.yaml"
        mode: "0600"
      when: dot_profile_data.features.inputactions | default(false)
      tags: [config, kde, gestures]

    - name: Install the state-aware Show Desktop adapter
      ansible.builtin.copy:
        src: "{{ dot_repo }}/config/inputactions/dot-show-desktop"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/dot-show-desktop"
        mode: "0755"
      when: dot_profile_data.features.inputactions | default(false)
      tags: [config, kde, gestures]

    - name: Read the InputActions KWin effect setting
      ansible.builtin.command:
        argv:
          - kreadconfig6
          - --file
          - kwinrc
          - --group
          - Plugins
          - --key
          - kwin_gesturesEnabled
      register: dot_inputactions_enabled
      changed_when: false
      failed_when: false
      check_mode: false
      when: dot_profile_data.features.inputactions | default(false)
      tags: [config, kde, gestures]

    - name: Enable the InputActions KWin effect
      ansible.builtin.command:
        argv:
          - kwriteconfig6
          - --file
          - kwinrc
          - --group
          - Plugins
          - --key
          - kwin_gesturesEnabled
          - "true"
      when:
        - dot_profile_data.features.inputactions | default(false)
        - not ansible_check_mode
        - dot_inputactions_enabled.stdout | trim != "true"
      changed_when: true
      tags: [config, kde, gestures]

    - name: Load the InputActions KWin effect
      ansible.builtin.command:
        argv:
          - qdbus6
          - org.kde.KWin
          - /Effects
          - org.kde.kwin.Effects.loadEffect
          - kwin_gestures
      register: dot_inputactions_effect
      changed_when: dot_inputactions_effect.stdout | trim == "true"
      when:
        - dot_profile_data.features.inputactions | default(false)
        - not ansible_check_mode
      tags: [config, kde, gestures]

    - name: Validate the active InputActions configuration
      ansible.builtin.command:
        argv: [inputactions, config, issues]
      changed_when: false
      when:
        - dot_profile_data.features.inputactions | default(false)
        - not ansible_check_mode
      tags: [config, kde, gestures]

    - name: Install or update tmux plugin manager
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm.git
        dest: "{{ ansible_facts.env.HOME }}/.config/tmux/plugins/tpm"
        version: master
        update: true
      when: dot_profile_data.features.shell | default(false)
      tags: [config, shell, tmux, app-updates]

    - name: Install configured tmux plugins
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.env.HOME }}/.config/tmux/plugins/tpm/bin/install_plugins"
      register: dot_tmux_plugins_install
      changed_when: "'Installing' in dot_tmux_plugins_install.stdout"
      failed_when: >-
        dot_tmux_plugins_install.rc != 0 or
        'FATAL:' in dot_tmux_plugins_install.stderr
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"
      when: dot_profile_data.features.shell | default(false)
      tags: [config, shell, tmux, app-updates]

    - name: Update configured tmux plugins
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.env.HOME }}/.config/tmux/plugins/tpm/bin/update_plugins"
          - all
      register: dot_tmux_plugins_update
      changed_when: false
      failed_when: >-
        dot_tmux_plugins_update.rc != 0 or
        'FATAL:' in dot_tmux_plugins_update.stderr
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"
      when: dot_profile_data.features.shell | default(false)
      tags: [config, shell, tmux, app-updates]

    - name: Create the systemd-logind configuration directory
      become: true
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      when: dot_profile_data.features.kde | default(false)
      tags: [config, kde]

    - name: Install the system lid and manual-sleep fallback policy
      become: true
      ansible.builtin.copy:
        src: "{{ dot_repo }}/config/systemd/logind/60-dotfiles-lid.conf"
        dest: /etc/systemd/logind.conf.d/60-dotfiles-lid.conf
        mode: "0644"
      when: dot_profile_data.features.kde | default(false)
      tags: [config, kde]

    - name: Make the IdeaPad screenshot key emit Print
      become: true
      ansible.builtin.copy:
        src: "{{ dot_repo }}/config/udev/90-dotfiles-ideapad-fn-lock.rules"
        dest: /etc/udev/rules.d/90-dotfiles-ideapad-fn-lock.rules
        mode: "0644"
      register: dot_ideapad_fn_lock_rule
      when: dot_profile_data.features.kde | default(false)
      tags: [config, kde, screenshots]

    - name: Apply the IdeaPad Print-key mode
      become: true
      ansible.builtin.command:
        argv:
          - udevadm
          - trigger
          - --action=add
          - --subsystem-match=platform
          - --sysname-match=VPC2004:00
      when:
        - dot_profile_data.features.kde | default(false)
        - dot_ideapad_fn_lock_rule.changed
        - not ansible_check_mode
      changed_when: true
      tags: [config, kde, screenshots]

    - name: Report when the system lid fallback becomes active
      ansible.builtin.debug:
        msg: >-
          The systemd-logind lid fallback is installed and will be guaranteed
          after the next reboot. PowerDevil's matching live policy is active
          immediately.
      when: dot_profile_data.features.kde | default(false)
      tags: [config, kde]

    - name: Provision Segoe UI Variable from Windows
      ansible.builtin.command:
        argv: ["{{ dot_repo }}/scripts/provision-segoe"]
      register: dot_segoe
      changed_when: >-
        dot_segoe.rc == 0 and
        dot_segoe.stdout is match('^Segoe UI Variable installed ')
      failed_when: false
      when: dot_profile_data.features.windows_fonts | default(false)
      tags: [fonts, kde]

    - name: Report unavailable Segoe source
      ansible.builtin.debug:
        msg: >-
          {{ dot_segoe.stdout |
             default('Segoe provisioning did not run') }}
      when:
        - dot_profile_data.features.windows_fonts | default(false)
        - dot_segoe.rc | default(0) != 0
      tags: [fonts, kde]

    - name: Make Zsh the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      when:
        - dot_profile_data.features.shell | default(false)
        - ansible_facts.system != "Windows"
        - ansible_facts.user_shell != "/usr/bin/zsh"
      tags: [shell]
