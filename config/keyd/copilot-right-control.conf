[ids]
*

[main]
# keyd normally routes both physical Control keys through one generic modifier
# layer, which makes Right Control emerge as Left Control. Preserve its identity
# because Remmina uses physical Right Control as its local host key.
rightcontrol = rightcontrol

# Microsoft Copilot keys emit Left Meta + Left Shift + F23. Treat the whole
# hardware chord as one Right Control key so the original modifiers do not leak.
leftmeta+leftshift+f23 = rightcontrol
