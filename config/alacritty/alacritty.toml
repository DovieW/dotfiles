
[terminal.shell]
# program = "/bin/bash"
program = "zsh"
args = [ "-lc", "exec tmux new-session -A -s main" ]

[env]
TERM = "xterm-256color"

[window]
opacity = 1.0
# blur = true
decorations = "None"
startup_mode = "Maximized"
dynamic_title = true
# padding = {x = 10, y = 10}

[font]
size = 12
normal = { family = "Cascadia Code", style = "Regular" }
# normal = { family = "MesloLGS NF", style = "Regular" }

[scrolling]
history = 15000

[bell]

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[cursor]
# style = { shape = "Beam", blinking = "Never" }
# vi_mode_style = { shape = "Block", blinking = "Never" }

[terminal]
osc52 = "CopyPaste"

