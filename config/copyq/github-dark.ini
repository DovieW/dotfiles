[General]
css_template_items=items
css_template_main_window=main_window
css_template_menu=menu
css_template_notification=notification

style_main_window=true
show_number=true
show_scrollbars=false
font_antialiasing=true
use_system_icons=true

icon_size=8
item_spacing=0
num_margin=2

font="Sans,11,-1,5,50,0,0,0,0,0"
find_font="Sans,11,-1,5,50,0,0,0,0,0"
num_font="Sans,8,-1,5,50,0,0,0,0,0"
edit_font="Sans,11,-1,5,50,0,0,0,0,0"
notes_font="Sans,11,-1,5,50,0,0,0,0,0"
notification_font="Sans,11,-1,5,50,0,0,0,0,0"

bg=#0d1117
fg=#e6edf3
alt_bg=#161b22
sel_bg=#1f6feb
sel_fg=#ffffff
find_bg=#d29922
find_fg=#0d1117
edit_bg=#161b22
edit_fg=#e6edf3
notes_bg=#21262d
notes_fg=#e6edf3
num_fg=#7d8590
num_sel_fg=#ffffff
notification_bg=#161b22
notification_fg=#e6edf3

css=

menu_bar_css="
    ;background: ${bg}
    ;color: ${fg}
    ;padding: 0.15em"
menu_bar_disabled_css="
    ;color: ${num_fg}"
menu_bar_selected_css="
    ;background: ${sel_bg}
    ;color: ${sel_fg}"
menu_css="
    ;background: ${alt_bg}
    ;color: ${fg}
    ;border: 1px solid #30363d"

tool_bar_css="
    ;background: ${bg}
    ;color: ${fg}
    ;border: 0"
tool_button_css="
    ;background: ${bg}
    ;color: ${fg}
    ;font-weight: normal
    ;border: 0
    ;border-radius: 2px"
tool_button_pressed_css="
    ;background: #30363d"
tool_button_selected_css="
    ;background: ${sel_bg}
    ;color: ${sel_fg}"

search_bar="
    ;background: ${edit_bg}
    ;color: ${edit_fg}
    ;margin: 0.2em 0 0.1em 0
    ;padding: 0.2em 0 0.2em 0
    ;border: 1px solid #30363d"
search_bar_focused="
    ;margin: 0.2em 0 0.1em 0
    ;padding: 0.2em 0 0.2em 0
    ;border: 1px solid #58a6ff"

tab_bar_css="
    ;background: ${bg}"
tab_bar_item_counter="
    ;color: ${num_fg}
    ;font-size: 6pt"
tab_bar_scroll_buttons_css="
    ;background: ${bg}
    ;color: ${fg}
    ;border: 0"
tab_bar_sel_item_counter="
    ;color: #58a6ff"
tab_bar_tab_unselected_css="
    ;background: ${bg}
    ;color: ${num_fg}
    ;padding: 0.2em
    ;border: 1px solid ${bg}"
tab_bar_tab_selected_css="
    ;background: ${alt_bg}
    ;color: ${fg}
    ;padding: 0.2em
    ;border: 1px solid #30363d
    ;border-radius: 2px"

tab_tree_css="
    ;background: ${bg}
    ;color: ${num_fg}"
tab_tree_item_counter="
    ;color: ${num_fg}
    ;font-size: 6pt"
tab_tree_sel_item_counter="
    ;color: #58a6ff"
tab_tree_sel_item_css="
    ;background: ${alt_bg}
    ;color: ${fg}
    ;border: 1px solid #30363d
    ;border-radius: 2px"

item_css="
    ;padding: 0.3em 0.5em 0.5em 0.5em"
alt_item_css=
sel_item_css=
cur_item_css="
    ;border: 1px solid #58a6ff"
hover_item_css="
    ;background: #21262d"
notes_css=
