# Explicit allowlist. Never log proc.psinfo.psargs, environ, cwd, maps or labels.
log mandatory on every 30 seconds {
  kernel.all.cpu
  kernel.all.load
  kernel.all.pressure
  mem.util
  mem.vmstat.pgpgin
  mem.vmstat.pgpgout
  mem.vmstat.pswpin
  mem.vmstat.pswpout
  disk.dev.read_bytes
  disk.dev.write_bytes
  disk.dev.total_rawactive
  network.interface.in.bytes
  network.interface.out.bytes
  proc.psinfo.pid
  proc.psinfo.ppid
  proc.psinfo.tgid
  proc.psinfo.start_time
  proc.psinfo.cmd
  proc.psinfo.sname
  proc.psinfo.utime
  proc.psinfo.stime
  proc.psinfo.threads
  proc.psinfo.maj_flt
  proc.psinfo.delayacct_blkio_time
  proc.memory.rss
  proc.memory.vmswap
  proc.io.read_bytes
  proc.io.write_bytes
}
