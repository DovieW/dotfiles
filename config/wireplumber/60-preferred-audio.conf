{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "~alsa_output.usb-Lenovo_Lenovo_Speakerphone_6000_.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 1400
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "~alsa_input.usb-Lenovo_Lenovo_Speakerphone_6000_.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 2500
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "~alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 1300
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "~alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 2300
        }
      }
    }
  ]
}
