# Windows-style touchpad gestures for Plasma Wayland.
#
# Recovery: hold Backspace+Space+Enter for two seconds to suspend
# InputActions until this file is reloaded, or run `dot gestures disable`.
autoreload: true
emergency_combination: [backspace, enter, space]

touchpad:
  gestures:
    # Accept motion within 45 degrees of vertical. Twenty-five steps cover the
    # full volume range. Allow reversals without exhausting a direction.
    - type: swipe
      fingers: 3
      angle: 45-135
      bidirectional: true
      actions:
        - on: update
          interval: 16
          wait: true
          command: >-
            [ -p "$XDG_RUNTIME_DIR/dot-volume-swipe" ] &&
            printf + | dd status=none conv=nocreat,notrunc oflag=nonblock,nofollow
            of="$XDG_RUNTIME_DIR/dot-volume-swipe"
        - on: update
          interval: -16
          wait: true
          command: >-
            [ -p "$XDG_RUNTIME_DIR/dot-volume-swipe" ] &&
            printf -- - | dd status=none conv=nocreat,notrunc oflag=nonblock,nofollow
            of="$XDG_RUNTIME_DIR/dot-volume-swipe"
        - on: end_cancel
          conflicting: false
          wait: true
          command: >-
            [ -p "$XDG_RUNTIME_DIR/dot-volume-swipe" ] &&
            printf '|' | dd status=none conv=nocreat,notrunc oflag=nonblock,nofollow
            of="$XDG_RUNTIME_DIR/dot-volume-swipe"

    # Windows switches applications with a three-finger horizontal swipe.
    - type: swipe
      fingers: 3
      direction: left
      actions:
        - plasma_shortcut: kwin,Walk Through Windows

    - type: swipe
      fingers: 3
      direction: right
      actions:
        - plasma_shortcut: kwin,Walk Through Windows (Reverse)

    # Four-finger horizontal swipes switch virtual desktops.
    - type: swipe
      fingers: 4
      direction: left
      actions:
        - plasma_shortcut: kwin,Switch One Desktop to the Left

    - type: swipe
      fingers: 4
      direction: right
      actions:
        - plasma_shortcut: kwin,Switch One Desktop to the Right

    # KWin 6.6 advertises showDesktop(bool) over DBus but ignores direct calls.
    # This state-aware adapter invokes KWin's working shortcut only when needed.
    - type: swipe
      fingers: 4
      direction: up
      actions:
        - command: $HOME/.local/bin/dot-show-desktop hide

    - type: swipe
      fingers: 4
      direction: down
      actions:
        - command: $HOME/.local/bin/dot-show-desktop show

    # Consume diagonal swipes so KWin cannot switch desktops in the opposite direction.
    - type: swipe
      fingers: 4
      direction: left_up_right_down

    - type: swipe
      fingers: 4
      direction: left_down_right_up
