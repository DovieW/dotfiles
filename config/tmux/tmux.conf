# Clipboard and terminal integration
set -g allow-passthrough on
set -g set-clipboard on
set-option -g default-shell "$SHELL"

# Use Ctrl-Space as the prefix.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Number windows and panes from one and keep window numbers compact.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Splits inherit the current pane's directory.
unbind %
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux configuration"
bind -r m resize-pane -Z
set -g mouse on

# Vi-style copy mode.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Preserve the terminal behavior from the most recent WSL configuration.
set -g default-terminal "xterm-256color"
set -g terminal-features '*:clipboard:ccolour:cstyle:focus:title:hyperlinks'
set -g terminal-overrides ",*256col*:Tc,*:Ss=\\E[%p1%d q:Se=\\E[ q"
set-environment -g COLORTERM "truecolor"
set -g xterm-keys on

# Move between tmux panes and Vim/Neovim splits with Alt-h/j/k/l.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n M-j if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n M-k if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n M-l if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'M-\' select-pane -l
bind-key -T copy-mode-vi M-h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi M-j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi M-k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi M-l if-shell -F '#{pane_at_right}'  {} { select-pane -R }
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l

# Open navi and paste the chosen command into the previous pane.
bind-key -T prefix C-g split-window \
  "$SHELL --login -i -c 'navi --print | head -n 1 | tmux load-buffer -b tmp - ; tmux paste-buffer -p -t {last} -b tmp -d'"

# TPM-managed plugins. The profile installs and updates these from upstream.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '300'

set -g @plugin 'niksingh710/minimal-tmux-status'
bind-key b set-option status
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#384c75"
set -g @minimal-tmux-indicator false
set -g @minimal-tmux-show-expanded-icon-for-all-tabs true

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-position 'right'
set -g @plugin 'tmux-plugins/tmux-sidebar'

run '~/.config/tmux/plugins/tpm/tpm'
