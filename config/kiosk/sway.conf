# No distribution includes, desktop services, bars, launchers, or terminal bindings.
xwayland disable
swaybg_command -
swaynag_command -
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 5000
seat * shortcuts_inhibitor disable
input * xkb_options srvrkeys:none
# Match the managed KDE touchpad settings; libinput quirks are system-wide.
input type:touchpad {
    accel_profile flat
    pointer_accel 0.2
    scroll_factor 0.1
    dwt enabled
}
bindsym --inhibited XF86AudioRaiseVolume exec /usr/bin/wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --inhibited XF86AudioLowerVolume exec /usr/bin/wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --inhibited XF86AudioMute exec /usr/bin/wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --inhibited XF86MonBrightnessUp exec /usr/local/libexec/browser-kiosk brightness-up
bindsym --inhibited XF86MonBrightnessDown exec /usr/local/libexec/browser-kiosk brightness-down
# Preserve the administrator authentication dialog above fullscreen Chrome.
popup_during_fullscreen leave_fullscreen
for_window [app_id=".*polkit.*"] floating enable, move position center
for_window [app_id=".*chrome.*"] fullscreen enable
bindsym --inhibited Ctrl+Alt+BackSpace exec /usr/local/libexec/browser-kiosk exit-request
exec /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec /usr/local/libexec/browser-kiosk browser
