# No distribution includes, desktop services, bars, launchers, or terminal bindings.
xwayland disable
swaybg_command -
swaynag_command -
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 5000
seat * shortcuts_inhibitor disable
input * xkb_options srvrkeys:none
# Preserve the administrator authentication dialog above fullscreen Chrome.
popup_during_fullscreen leave_fullscreen
for_window [app_id=".*polkit.*"] floating enable, move position center
for_window [app_id=".*chrome.*"] fullscreen enable
bindsym --inhibited Ctrl+Alt+BackSpace exec /usr/local/libexec/browser-kiosk exit-request
exec /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec /usr/local/libexec/browser-kiosk browser
