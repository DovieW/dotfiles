# Graphical applications and user services need the same user toolchain as
# interactive shells. In particular, Codex plugin MCP launchers resolve Node
# through PATH rather than a version-specific absolute path.
PATH=${HOME}/.vite-plus/bin:${HOME}/.local/bin:${HOME}/bin:${HOME}/.cargo/bin:${HOME}/go/bin:${HOME}/.bun/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
