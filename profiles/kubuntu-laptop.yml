{
  "schema_version": 1,
  "name": "kubuntu-laptop",
  "inherits": ["common-linux"],
  "account": "personal",
  "features": {
    "codex_remote_control": true,
    "docker_engine": true,
    "firacode_nerd_font": true,
    "inputactions": true,
    "kde": true,
    "nvidia_driver": true,
    "nvidia_dynamic_boost": false,
    "tailscale": true,
    "touchpad_jump_workaround": true,
    "windows_fonts": true
  },
  "packages": {
    "apt": [
      "flameshot",
      "fonts-cascadia-code",
      "ghostty",
      "kde-config-gtk-style",
      "kio-extras",
      "konsole",
      "mpv",
      "plasma-workspace",
      "tailscale",
      "xclip"
    ],
    "brew": ["lazydocker", "lazygit", "wl-clipboard"],
    "deb": ["bitwarden", "obsidian"],
    "snap": []
  }
}
