{
  "schema_version": 1,
  "name": "kubuntu-desktop",
  "inherits": ["kubuntu-laptop"],
  "account": "personal",
  "features": {
    "anydesk": false,
    "chatgpt_desktop": false,
    "codex_remote_control_mode": "headless",
    "factory_display_profile": false,
    "ideapad_fn_lock": false,
    "krdp_server": true,
    "lid_power_saver": false,
    "nvidia_driver": false,
    "nvidia_dynamic_boost": false,
    "touchpad_jump_workaround": false
  },
  "packages": {
    "apt": [
      "libasound2-dev",
      "libayatana-appindicator3-dev",
      "libgtk-3-dev",
      "librsvg2-dev",
      "libwebkit2gtk-4.1-0",
      "libwebkit2gtk-4.1-dev",
      "patchelf",
      "pkg-config",
      "ratbagd"
    ],
    "brew": [],
    "deb": [],
    "snap": []
  }
}
