---
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-validation.txt
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep shellcheck
          python3 -m pip install --requirement .github/requirements-validation.txt
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install neovim stylua
      - name: Validate
        run: ./tests/run
      - name: Ansible lint
        run: ansible-lint ansible/local.yml
      - name: YAML lint
        run: yamllint ansible .github
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.0 -Force -Scope CurrentUser
      - name: Test Windows adapter
        shell: pwsh
        run: Invoke-Pester tests/windows.Tests.ps1 -CI
